# LoadScreenShield configuration schema. Unknown/custom keys are preserved on reload.
schema-version: 2

# Bundled values: en, tr. Custom file names may use letters, numbers, '_' and '-'.
lang: en
prefix: "<gray>[<gold>LoadScreenShield</gold>]</gray> "

# JOIN protects immediately and is recommended when a proxy sends the pack.
# RESOURCE_PACK_STATUS begins protection when ACCEPTED/DOWNLOADED is reported.
activation-mode: JOIN

# Safety bounds: 5-1800 seconds. Unknown future statuses remain protected until this timeout.
timeout-seconds: 120

# Client-only overlay. Safety bounds: radius 1-4 (27-729 block states before world-height clipping).
shield-box-radius: 2
shield-block-type: BLACK_WOOL

title:
  enabled: true

bedrock:
  # Floodgate is optional and linked without bundling its API.
  ignore-floodgate: true

protection:
  enabled: true
  cancel-movement: true
  cancel-commands: true
  cancel-teleports: true
