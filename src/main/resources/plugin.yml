name: LoadScreenShield
version: '${project.version}'
main: com.siberanka.loadscreenshield.LoadScreenShield
api-version: '1.21'
folia-supported: true
description: Protects players while server resource packs are downloaded and applied.
author: siberanka
website: https://github.com/siberanka/LoadScreenShield
softdepend: [floodgate]

commands:
  loadscreenshield:
    description: Reload LoadScreenShield configuration and language files.
    aliases: [lss]
    usage: /<command> reload
    permission: loadscreenshield.admin
    permission-message: "<red>You do not have permission to use this command.</red>"

permissions:
  loadscreenshield.admin:
    description: Allows reloading the plugin configuration and language files.
    default: op
